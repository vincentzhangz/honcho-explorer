name: Feature request
description: Suggest an improvement for Honcho Explorer
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Describe the problem you want to solve and your proposed idea.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What limitation or friction are you hitting today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How should the product behave?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Additional context
    validations:
      required: false
